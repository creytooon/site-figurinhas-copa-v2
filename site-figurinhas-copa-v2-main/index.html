  <!-- SEO DINÂMICO -->
  <script>
    (function applyDynamicSEO() {
      try {
        const saved = localStorage.getItem("site_config_v1");
        if (!saved) return;
        const cfg = JSON.parse(saved);
        if (cfg.seo) {
          if (cfg.seo.title)       document.title = cfg.seo.title;
          if (cfg.seo.description) {
            document.querySelector('meta[name="description"]')?.setAttribute("content", cfg.seo.description);
            document.querySelector('meta[property="og:description"]')?.setAttribute("content", cfg.seo.description);
          }
          if (cfg.seo.keywords) document.querySelector('meta[name="keywords"]')?.setAttribute("content", cfg.seo.keywords);
          if (cfg.seo.ogImage)  document.querySelector('meta[property="og:image"]')?.setAttribute("content", cfg.seo.ogImage);
        }
      } catch(e) {}
    })();
  </script>
